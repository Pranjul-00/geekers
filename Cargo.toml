[package]
name = "contexto-bot"
version = "0.2.0"
edition = "2021"

[dependencies]
poise = { version = "0.7.1", default-features = false, features = ["cache", "chrono"] }
serenity = { version = "0.12.5", default-features = false, features = ["rustls_backend", "client", "gateway", "model"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time", "fs"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
dotenvy = "0.15"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dashmap = "6.1"
