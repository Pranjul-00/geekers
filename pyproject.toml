[project]
name = "geekers"
version = "0.1.0"
description = "Monorepo for daily game Discord bots (Contexto, Conexo, Letresso, Expresso, Wordle, etc.)"
readme = "README.md"
authors = [
    { name = "Woeter", email = "skippedlead@gmail.com" },
    { name = "Pranjul", email = "pranjul@users.noreply.github.com" }
]
requires-python = ">=3.11"
dependencies = [
    "aiohttp>=3.10.0",
    "discord-py>=2.3.0",
    "python-dotenv>=1.0.0",
]

[project.scripts]
geekers = "geekers:main"
contexto-bot = "bots.contexto.bot:main"
expresso-bot = "bots.expresso.bot:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["geekers"]

[tool.setuptools.packages.find]
where = ["."]
include = ["bots*", "shared*"]
