[project]
name = "geekers"
version = "0.1.0"
description = "Monorepo for daily game Discord bots (Contexto, Conexo, Letresso, Expresso, Wordle, etc.)"
readme = "README.md"
authors = [
    { name = "Woeter", email = "skippedlead@gmail.com" },
    { name = "Pranjul", email = "pranjul@users.noreply.github.com" }
]
requires-python = ">=3.11"
dependencies = [
    "aiohttp>=3.10.0",
    "discord-py>=2.3.0",
    "python-dotenv>=1.0.0",
]

[project.scripts]
contexto-bot = "bots.contexto.bot:main"

[build-system]
requires = ["uv_build>=0.12.11,<0.13.0"]
build-backend = "uv_build"
